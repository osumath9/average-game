<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>평균 맞추기 게임</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

    <style>
        @font-face {
            font-family: 'Pretendard-Regular';
            src: url('https://fastly.jsdelivr.net/gh/Project-Noonnu/noonfonts_2107@1.1/Pretendard-Regular.woff') format('woff');
            font-weight: 400;
        }
        body { font-family: 'Pretendard-Regular', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* 계산기 버튼 클릭 효과 */
        .calc-btn:active { transform: scale(0.95); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 메인 앱 컨테이너 -->
    <div id="app" class="flex-grow flex flex-col relative w-full h-full max-w-7xl mx-auto p-4 sm:p-6 lg:p-8"></div>

    <!-- 토스트 알림창 -->
    <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 bg-gray-900 text-white px-8 py-4 rounded-full shadow-2xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 text-xl font-bold text-center w-max max-w-[90vw]">
        알림 메시지
    </div>

    <!-- 교사 비밀번호 입력 모달 -->
    <div id="pwModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 fade-in">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center">
            <h2 class="text-2xl font-bold mb-6 text-gray-800">관리자 비밀번호</h2>
            <input type="password" id="pwInput" class="w-full px-4 py-4 border-2 border-gray-300 rounded-xl mb-8 text-center text-3xl tracking-[0.5em] focus:ring-4 focus:ring-blue-200 focus:outline-none" placeholder="****">
            <div class="flex gap-4">
                <button id="pwCancelBtn" class="flex-1 bg-gray-200 text-gray-800 py-4 rounded-xl font-bold text-xl hover:bg-gray-300 transition-colors">취소</button>
                <button id="pwSubmitBtn" class="flex-1 bg-gray-800 text-white py-4 rounded-xl font-bold text-xl hover:bg-gray-900 transition-colors">확인</button>
            </div>
        </div>
    </div>

    <!-- 사용자 정의 확인 모달 (window.confirm 대체) -->
    <div id="confirmModal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center hidden z-50 fade-in">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center border-t-8 border-red-500">
            <div class="text-5xl mb-4">⚠️</div>
            <h2 class="text-2xl font-black mb-4 text-gray-800">정말 진행하시겠습니까?</h2>
            <p id="confirmMessage" class="text-lg text-gray-600 mb-8 whitespace-pre-line"></p>
            <div class="flex gap-4">
                <button id="confirmCancelBtn" class="flex-1 bg-gray-200 text-gray-800 py-4 rounded-xl font-bold text-xl hover:bg-gray-300 transition-colors">취소</button>
                <button id="confirmOkBtn" class="flex-1 bg-red-600 text-white py-4 rounded-xl font-bold text-xl hover:bg-red-700 transition-colors">확인</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, writeBatch, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =====================================================================
        // [중요] 선생님의 Firebase 설정으로 변경하세요!
        // =====================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDTJw9QJ93KRajfZ4uZ9d1Qtn_RjttZJJ8",
            authDomain: "blind-average-auction.firebaseapp.com",
            databaseURL: "https://blind-average-auction-default-rtdb.firebaseio.com",
            projectId: "blind-average-auction",
            storageBucket: "blind-average-auction.firebasestorage.app",
            messagingSenderId: "596955232912",
            appId: "1:596955232912:web:8683c5fcf358ad7c10b615"
        };

        // 전역 상태 관리
        let appInstance, db;
        let isFirebaseReady = false;
        
        let currentMode = 'lobby'; // lobby(이미지 대기), select(이름입력), student, teacher
        let myId = null;   // 학번
        let myName = null; // 이름
        let myKey = null;  // 학번_이름 (DB 문서 ID)

        let globalGameState = { round: 1, phase: 'bidding', mode: 'avg', isGameStarted: false };
        let allStudentsData = [];

        // DOM Elements
        const appContainer = document.getElementById('app');
        const toastEl = document.getElementById('toast');

        function showToast(message, isError = false) {
            toastEl.textContent = message;
            toastEl.style.backgroundColor = isError ? '#ef4444' : '#111827';
            toastEl.style.opacity = '1';
            setTimeout(() => { toastEl.style.opacity = '0'; }, 3000);
        }

        let confirmCallback = null;
        function showConfirm(message, callback) {
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmModal').classList.remove('hidden');
            confirmCallback = callback;
        }

        document.getElementById('confirmCancelBtn').addEventListener('click', () => {
            document.getElementById('confirmModal').classList.add('hidden');
            confirmCallback = null;
        });

        document.getElementById('confirmOkBtn').addEventListener('click', () => {
            document.getElementById('confirmModal').classList.add('hidden');
            if (confirmCallback) confirmCallback();
            confirmCallback = null;
        });

        function renderMath() {
            if (window.renderMathInElement) {
                renderMathInElement(appContainer, {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false},
                        {left: '\\[', right: '\\]', display: true},
                        {left: '\\(', right: '\\)', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        try {
            appInstance = initializeApp(firebaseConfig);
            db = getFirestore(appInstance);
            isFirebaseReady = firebaseConfig.projectId !== "YOUR_PROJECT_ID";
        } catch (e) {
            console.error("Firebase Init Error:", e);
            isFirebaseReady = false;
        }

        function setupFirebaseListeners() {
            if (!isFirebaseReady) return;

            // 게임 상태 구독
            onSnapshot(doc(db, "game", "state"), (docSnap) => {
                if (docSnap.exists()) {
                    globalGameState = docSnap.data();
                    if (!globalGameState.mode) globalGameState.mode = 'avg'; // 기본값 설정
                    if (globalGameState.isGameStarted === undefined) globalGameState.isGameStarted = false;
                    
                    // 학생 화면에서 게임이 시작되면 입력 화면으로 이동
                    if (currentMode === 'lobby' && globalGameState.isGameStarted) {
                        currentMode = 'select';
                    } else if (currentMode === 'select' && !globalGameState.isGameStarted) {
                        // 교사가 초기화해서 게임 시작 상태가 false가 되면 다시 로비로
                        currentMode = 'lobby';
                    }
                } else {
                    setDoc(doc(db, "game", "state"), { round: 1, phase: 'bidding', mode: 'avg', isGameStarted: false });
                }
                renderUI();
            });

            // 학생 데이터 구독
            onSnapshot(collection(db, "students"), (snapshot) => {
                const students = [];
                snapshot.forEach((docSnap) => {
                    students.push({ key: docSnap.id, ...docSnap.data() });
                });
                students.sort((a, b) => (a.studentId || '').localeCompare(b.studentId || '', 'ko'));
                allStudentsData = students;
                renderUI();
            });
        }

        window.handleJoin = async (e) => {
            e.preventDefault();
            const idInput = document.getElementById('studentIdInput').value.trim();
            const nameInput = document.getElementById('studentNameInput').value.trim();
            
            if (!idInput || !nameInput) return showToast("학번과 이름을 모두 입력하세요.", true);
            
            myId = idInput;
            myName = nameInput;
            myKey = `${myId}_${myName}`;
            currentMode = 'student';
            renderUI();
            showToast(`${myName} 학생, 환영합니다!`);

            if (isFirebaseReady) {
                await setDoc(doc(db, "students", myKey), {
                    studentId: myId,
                    name: myName,
                    lastUpdated: Date.now()
                }, { merge: true });
            }
        };

        window.handleBidSubmit = async (e) => {
            e.preventDefault();
            const bidInput = parseInt(document.getElementById('bidInput').value, 10);
            
            if (isNaN(bidInput) || bidInput < 0 || bidInput > 100) {
                return showToast("0부터 100 사이의 정수만 입력 가능합니다.", true);
            }

            const me = allStudentsData.find(s => s.key === myKey) || {};
            const existingBids = me.submissions || {};
            const newBids = { ...existingBids, [globalGameState.round]: bidInput };

            if (isFirebaseReady) {
                await setDoc(doc(db, "students", myKey), { submissions: newBids }, { merge: true });
                showToast("제출이 완료되었습니다!");
            }
        };

        // 교사 모달 제어
        window.openPwModal = () => {
            document.getElementById('pwModal').classList.remove('hidden');
            const pwInput = document.getElementById('pwInput');
            pwInput.value = '';
            setTimeout(() => pwInput.focus(), 50);
        };

        const closePwModal = () => document.getElementById('pwModal').classList.add('hidden');
        document.getElementById('pwCancelBtn').addEventListener('click', closePwModal);
        
        const tryTeacherLogin = () => {
            const pw = document.getElementById('pwInput').value;
            if (pw === '13579') {
                currentMode = 'teacher';
                closePwModal();
                renderUI();
                showToast("교사 모드로 접속되었습니다.");
            } else {
                showToast("비밀번호가 틀렸습니다.", true);
                document.getElementById('pwInput').value = '';
                document.getElementById('pwInput').focus();
            }
        };
        document.getElementById('pwSubmitBtn').addEventListener('click', tryTeacherLogin);
        document.getElementById('pwInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') tryTeacherLogin(); });

        window.handleRevealResults = async () => {
            if (isFirebaseReady) {
                await setDoc(doc(db, "game", "state"), { ...globalGameState, phase: 'revealed' });
                showToast("결과가 학생 화면에 공개되었습니다.");
            }
        };

        window.handleNextRound = async () => {
            if (isFirebaseReady) {
                await setDoc(doc(db, "game", "state"), { round: globalGameState.round + 1, phase: 'bidding', mode: globalGameState.mode, isGameStarted: true });
                showToast("다음 라운드를 시작합니다.");
            }
        };

        window.handleStartGame = async () => {
            if (isFirebaseReady) {
                await setDoc(doc(db, "game", "state"), { ...globalGameState, isGameStarted: true });
                showToast("학생들이 입장을 시작할 수 있습니다.");
            }
        };

        window.handleSetMode = async (newMode) => {
            if (isFirebaseReady) {
                await setDoc(doc(db, "game", "state"), { ...globalGameState, mode: newMode, isGameStarted: globalGameState.isGameStarted });
                showToast("게임 모드가 변경되었습니다.");
            }
        };

        window.handleResetGame = () => {
            showConfirm("모든 학생의 접속 기록과 제출 정보가 완전히 삭제됩니다.\n(새로운 반 수업을 시작할 때 사용하세요.)\n\n초기화 하시겠습니까?", async () => {
                if (isFirebaseReady) {
                    await setDoc(doc(db, "game", "state"), { round: 1, phase: 'bidding', mode: 'avg', isGameStarted: false });
                    const batch = writeBatch(db);
                    allStudentsData.forEach(student => {
                        batch.delete(doc(db, "students", student.key));
                    });
                    await batch.commit();
                    
                    // 초기화 시 교사 화면은 유지하지만 학생들은 튕겨나가도록 처리하려면
                    // 로컬 상태도 업데이트 해줍니다 (학생 클라이언트에서 감지하도록)
                    if(currentMode !== 'teacher') currentMode = 'lobby';
                    myId = null;
                    myName = null;
                    myKey = null;

                    showToast("모든 데이터가 삭제되고 대기 화면으로 초기화되었습니다.");
                }
            });
        };

        // 계산기 내부 상태 관리 객체 (전역 접근 가능하도록)
        window.calcState = {
            currentValue: '0',
            previousValue: null,
            operator: null,
            waitingForNewValue: false,
            isVisible: false // 계산기 표시 여부 상태 추가
        };

        // 교사용 화면 진행 모드 표시 상태 관리
        window.teacherState = {
            isModeVisible: false
        };

        window.toggleModeVisibility = () => {
            window.teacherState.isModeVisible = !window.teacherState.isModeVisible;
            renderUI();
        };

        window.toggleCalc = () => {
            window.calcState.isVisible = !window.calcState.isVisible;
            renderUI();
        };

        window.handleCalcBtn = (val) => {
            let { currentValue, previousValue, operator, waitingForNewValue } = window.calcState;
            const display = document.getElementById('calcDisplay');

            if (['+', '-', '*', '/'].includes(val)) {
                if (operator && !waitingForNewValue) {
                    currentValue = calculateResult(previousValue, currentValue, operator);
                }
                window.calcState.previousValue = currentValue;
                window.calcState.operator = val;
                window.calcState.waitingForNewValue = true;
                
            } else if (val === '=') {
                if (operator && previousValue !== null) {
                    currentValue = calculateResult(previousValue, currentValue, operator);
                    window.calcState.previousValue = null;
                    window.calcState.operator = null;
                    window.calcState.waitingForNewValue = true;
                }
            } else if (val === 'C') {
                currentValue = '0';
                window.calcState.previousValue = null;
                window.calcState.operator = null;
                window.calcState.waitingForNewValue = false;
            } else {
                // Number or Decimal point
                if (waitingForNewValue) {
                    if (val === '.') {
                        currentValue = '0.';
                    } else {
                        currentValue = val;
                    }
                    window.calcState.waitingForNewValue = false;
                } else {
                    if (currentValue === '0' && val !== '.') {
                        currentValue = val;
                    } else if (val === '.' && currentValue.includes('.')) {
                        // ignore duplicate dots
                    } else {
                        currentValue += val;
                    }
                }
            }
            
            // 최대 길이 제한
            if (currentValue.length > 12) currentValue = currentValue.substring(0, 12);
            window.calcState.currentValue = String(currentValue);
            
            if (display) display.textContent = window.calcState.currentValue;
        };

        function calculateResult(a, b, op) {
            const numA = parseFloat(a);
            const numB = parseFloat(b);
            let result = 0;
            switch(op) {
                case '+': result = numA + numB; break;
                case '-': result = numA - numB; break;
                case '*': result = numA * numB; break;
                case '/': result = numB === 0 ? 0 : numA / numB; break;
            }
            // 소수점 4자리에서 끊기 (부동소수점 오류 완화)
            return String(Math.round(result * 10000) / 10000);
        }

        function getNeedsSetupView() {
            return `
                <div class="flex-grow flex items-center justify-center fade-in">
                    <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-2xl text-center border-t-8 border-red-500">
                        <h1 class="text-3xl font-bold text-red-600 mb-6">Firebase 설정이 필요합니다 ⚠️</h1>
                        <p class="text-lg text-gray-700 mb-4 text-left">소스 코드의 <code class="bg-gray-100 text-red-500 px-2 py-1 rounded">firebaseConfig</code> 부분에 선생님의 프로젝트 정보를 넣어야 작동합니다.</p>
                        <button onclick="location.reload()" class="bg-gray-800 text-white px-8 py-3 rounded-xl font-bold hover:bg-gray-700 mt-4">설정 후 새로고침</button>
                    </div>
                </div>
            `;
        }

        function getLobbyView() {
            return `
                <div class="absolute top-4 right-6 z-50">
                    <button onclick="openPwModal()" class="text-gray-300 hover:text-gray-500 transition-colors p-2" title="교사 관리자 페이지">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                        </svg>
                    </button>
                </div>
                <div class="flex-grow flex items-center justify-center fade-in w-full h-full p-0">
                    <img src="평균 개념 정리.png" alt="평균 개념 정리" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/1920x1080/e0f2fe/1e3a8a?text=평균+개념+정리+이미지를+찾을+수+없습니다.\\n(동일한+폴더에+%22평균+개념+정리.png%22+파일을+넣어주세요)'">
                </div>
            `;
        }

        function getSelectView() {
            return `
                <div class="flex-grow flex items-center justify-center fade-in">
                    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md text-center border-t-8 border-blue-500">
                        <div class="text-blue-500 text-5xl mb-4">🎯</div>
                        <h1 class="text-4xl font-black text-gray-800 mb-2 tracking-tight">평균 맞추기 게임</h1>
                        <p class="text-lg text-gray-500 mb-8 font-medium">선생님이 제시하는 목표값을 가장 가깝게 예측하세요!</p>
                        
                        <form onsubmit="handleJoin(event)" class="space-y-4">
                            <input type="text" id="studentIdInput" class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-300 rounded-xl text-xl text-center focus:ring-4 focus:ring-blue-200" placeholder="학번 (예: 10101)" required autocomplete="off">
                            <input type="text" id="studentNameInput" class="w-full px-5 py-4 bg-gray-50 border-2 border-gray-300 rounded-xl text-xl text-center focus:ring-4 focus:ring-blue-200" placeholder="이름 (예: 홍길동)" required autocomplete="off">
                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-2xl shadow-md transition-all mt-4">입장하기</button>
                        </form>
                    </div>
                </div>
            `;
        }

        function getStudentView() {
            const currentRound = globalGameState.round;
            const currentPhase = globalGameState.phase;
            const me = allStudentsData.find(s => s.key === myKey) || { submissions: {} };
            const submissions = me.submissions || {};
            const hasSubmitted = submissions[currentRound] !== undefined;
            const calcVisible = window.calcState.isVisible;

            let mainContent = '';
            
            let modeText = '';
            if (globalGameState.mode === 'avg') {
                modeText = "친구들이 어떤 숫자를 낼지 예측해보고,<br>그 <strong>'평균'</strong>이 될 숫자를 적어보세요.";
            } else if (globalGameState.mode === 'avg_plus_5') {
                modeText = "친구들이 어떤 숫자를 낼지 예측해보고,<br>그 <strong>'평균에 5를 더한 값'</strong>이 될 숫자를 적어보세요.";
            } else {
                modeText = "친구들이 어떤 숫자를 낼지 예측해보고,<br>그 <strong>평균의 $\\frac{2}{3}$</strong>가 될 숫자를 적어보세요.";
            }

            if (currentPhase === 'bidding') {
                if (hasSubmitted) {
                    mainContent = `
                        <div class="bg-gray-50 rounded-3xl p-10 text-center border-2 border-gray-200 mt-6 md:mt-0 flex-1 flex flex-col justify-center shadow-inner h-full min-h-[300px]">
                            <div class="text-7xl mb-6">✅</div>
                            <h2 class="text-3xl font-bold text-gray-800 mb-4">${currentRound}라운드 제출 완료!</h2>
                            <p class="text-xl text-gray-600">나의 선택: <strong class="text-blue-600 text-4xl ml-2">${submissions[currentRound]}</strong></p>
                            <p class="mt-10 text-gray-500 font-medium bg-gray-200 py-3 rounded-xl inline-block px-6">훌륭해요! 선생님이 결과를 공개할 때까지 화면을 보고 기다려주세요.</p>
                        </div>
                    `;
                } else {
                    mainContent = `
                        <form onsubmit="handleBidSubmit(event)" class="bg-white rounded-3xl p-6 shadow-xl border-t-8 border-blue-500 mt-6 md:mt-0 flex-1 flex flex-col justify-center h-full min-h-[300px]">
                            <label class="block text-gray-800 font-bold mb-4 text-2xl text-center">0 ~ 100 사이의 정수 입력</label>
                            <p class="text-gray-500 text-center mb-6 text-sm">${modeText}</p>
                            <input type="number" id="bidInput" class="w-full px-6 py-6 bg-gray-50 border-2 border-gray-300 rounded-2xl text-5xl font-black text-center text-blue-700 focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-100 mb-6" placeholder="0" min="0" max="100" required>
                            <button type="submit" class="w-full block bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-5 rounded-xl text-2xl shadow-lg transition-all transform hover:-translate-y-1">
                                확정 및 제출
                            </button>
                        </form>
                    `;
                }
            } else {
                mainContent = `
                    <div class="bg-indigo-50 rounded-3xl p-10 text-center border-4 border-indigo-200 mt-6 md:mt-0 flex-1 flex flex-col justify-center h-full min-h-[300px]">
                        <div class="text-7xl mb-6 animate-bounce">🎉</div>
                        <h2 class="text-3xl sm:text-4xl font-black text-indigo-900 mb-4 break-keep">결과가 공개되었습니다!</h2>
                        <p class="text-xl sm:text-2xl text-indigo-700 bg-white py-3 rounded-xl shadow-sm inline-block px-6 border border-indigo-100">앞 화면(교사 화면)을 주목해 주세요.</p>
                    </div>
                `;
            }

            // 계산기 UI (좌측 또는 상단) 버튼 클래스
            const calcBtnClass = "calc-btn bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold text-2xl py-4 rounded-xl shadow-sm transition-all";
            const calcOpClass = "calc-btn bg-indigo-100 hover:bg-indigo-200 text-indigo-700 font-bold text-2xl py-4 rounded-xl shadow-sm transition-all";
            
            return `
                <div class="flex-grow flex flex-col fade-in w-full max-w-5xl mx-auto pt-4">
                    <!-- 헤더 -->
                    <div class="bg-white rounded-2xl p-4 sm:p-5 shadow-sm border border-gray-200 flex justify-between items-center mb-6">
                        <div class="flex items-center gap-3">
                            <div class="bg-blue-100 text-blue-800 font-black px-4 py-1.5 rounded-lg text-sm sm:text-base border border-blue-200">
                                ${currentRound} 라운드
                            </div>
                        </div>
                        <div class="text-right">
                            <span class="text-gray-500 font-bold text-sm sm:text-base">${myId}</span>
                            <span class="text-2xl sm:text-3xl font-black text-gray-800 ml-2">${myName}</span>
                        </div>
                    </div>

                    <!-- 메인 컨텐츠 영역 (계산기 + 폼) -->
                    <div class="flex flex-col md:flex-row gap-6 lg:gap-10 flex-grow relative">
                        
                        <!-- 계산기 토글 및 영역 -->
                        <div class="w-full ${calcVisible ? 'md:w-1/2 lg:w-5/12' : 'md:w-auto'} flex flex-col items-start transition-all duration-300 z-10">
                            <button onclick="toggleCalc()" class="mb-4 bg-white hover:bg-gray-50 text-gray-700 font-bold py-3 px-5 rounded-xl shadow-md border border-gray-200 flex items-center gap-2 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-500" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M5 2a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V4a2 2 0 00-2-2H5zm0 2h10v3H5V4zm1 5h8v2H6V9zm0 4h8v2H6v-2z" clip-rule="evenodd" />
                                </svg>
                                ${calcVisible ? '계산기 닫기' : '계산기 열기'}
                            </button>
                            
                            ${calcVisible ? `
                            <div class="w-full bg-white p-6 rounded-3xl shadow-xl border border-gray-200 flex flex-col fade-in">
                                <div class="bg-gray-900 text-white text-right text-4xl p-4 rounded-xl font-mono overflow-x-auto mb-4 tracking-wider h-16 flex items-center justify-end" id="calcDisplay">
                                    ${window.calcState.currentValue}
                                </div>
                                <div class="grid grid-cols-4 gap-3 flex-grow">
                                    <button type="button" onclick="handleCalcBtn('C')" class="calc-btn col-span-3 bg-red-100 hover:bg-red-200 text-red-700 font-bold text-2xl py-4 rounded-xl shadow-sm transition-all">C</button>
                                    <button type="button" onclick="handleCalcBtn('/')" class="${calcOpClass}">÷</button>
                                    
                                    <button type="button" onclick="handleCalcBtn('7')" class="${calcBtnClass}">7</button>
                                    <button type="button" onclick="handleCalcBtn('8')" class="${calcBtnClass}">8</button>
                                    <button type="button" onclick="handleCalcBtn('9')" class="${calcBtnClass}">9</button>
                                    <button type="button" onclick="handleCalcBtn('*')" class="${calcOpClass}">×</button>
                                    
                                    <button type="button" onclick="handleCalcBtn('4')" class="${calcBtnClass}">4</button>
                                    <button type="button" onclick="handleCalcBtn('5')" class="${calcBtnClass}">5</button>
                                    <button type="button" onclick="handleCalcBtn('6')" class="${calcBtnClass}">6</button>
                                    <button type="button" onclick="handleCalcBtn('-')" class="${calcOpClass}">-</button>
                                    
                                    <button type="button" onclick="handleCalcBtn('1')" class="${calcBtnClass}">1</button>
                                    <button type="button" onclick="handleCalcBtn('2')" class="${calcBtnClass}">2</button>
                                    <button type="button" onclick="handleCalcBtn('3')" class="${calcBtnClass}">3</button>
                                    <button type="button" onclick="handleCalcBtn('+')" class="${calcOpClass}">+</button>

                                    <button type="button" onclick="handleCalcBtn('0')" class="calc-btn col-span-2 bg-gray-100 hover:bg-gray-200 text-gray-800 font-bold text-2xl py-4 rounded-xl shadow-sm transition-all">0</button>
                                    <button type="button" onclick="handleCalcBtn('.')" class="${calcBtnClass}">.</button>
                                    <button type="button" onclick="handleCalcBtn('=')" class="calc-btn bg-blue-500 hover:bg-blue-600 text-white font-bold text-2xl py-4 rounded-xl shadow-sm transition-all">=</button>
                                </div>
                            </div>
                            ` : ''}
                        </div>

                        <!-- 제출 폼 / 결과 대기 -->
                        <div class="flex-1 flex flex-col transition-all duration-300 ${!calcVisible ? 'max-w-2xl mx-auto w-full' : ''}">
                            ${mainContent}
                        </div>
                        
                    </div>
                </div>
            `;
        }

        function getTeacherView() {
            const currentRound = globalGameState.round;
            const isRevealed = globalGameState.phase === 'revealed';
            const isGameStarted = globalGameState.isGameStarted;

            let submissionsThisRound = [];
            let sum = 0;
            
            allStudentsData.forEach(s => {
                const subs = s.submissions || {};
                const val = subs[currentRound] !== undefined ? Number(subs[currentRound]) : null;
                submissionsThisRound.push({ name: s.name, id: s.studentId, val: val });
                if (val !== null) sum += val;
            });

            const validSubs = submissionsThisRound.filter(s => s.val !== null);
            const numBidders = validSubs.length;
            
            // 수학적 계산
            let average = 0;
            let targetValue = 0;
            
            if (numBidders > 0) {
                average = sum / numBidders;
                if (globalGameState.mode === 'avg') {
                    targetValue = average;
                } else if (globalGameState.mode === 'avg_plus_5') {
                    targetValue = average + 5;
                } else {
                    targetValue = average * (2 / 3);
                }
            }
            
            // 소수점 첫째 자리까지 표시용 포맷팅 (반올림)
            const formatNum = (num) => (Math.round(num * 10) / 10).toFixed(1);
            const displayAvg = formatNum(average);
            const displayTarget = formatNum(targetValue);
            
            let targetTitle = '';
            if (globalGameState.mode === 'avg') targetTitle = '목표값 (평균)';
            else if (globalGameState.mode === 'avg_plus_5') targetTitle = '목표값 (평균 + 5)';
            else targetTitle = '목표값 (평균의 $\\frac{2}{3}$)';

            let boardHTML = '';
            
            if (isRevealed) {
                // 목표값과의 차이 계산 및 정렬 (가장 가까운 사람이 위로)
                const scoredSubs = validSubs.map(s => {
                    const diff = Math.abs(s.val - targetValue);
                    return { ...s, diff };
                });
                
                scoredSubs.sort((a, b) => a.diff - b.diff);
                const minDiff = scoredSubs.length > 0 ? scoredSubs[0].diff : -1;

                boardHTML = `
                    <div class="flex flex-col lg:flex-row gap-8 mb-8 items-stretch mt-4">
                        <!-- 좌측: 계산 결과 패널 -->
                        <div class="w-full lg:w-1/3 flex flex-col gap-6">
                            <!-- 평균 카드 -->
                            <div class="bg-white rounded-3xl p-8 shadow-xl border border-gray-200 text-center flex-1 flex flex-col justify-center">
                                <h3 class="text-2xl text-gray-500 font-bold mb-2">학급 전체 평균</h3>
                                <div class="text-6xl font-black text-gray-800 break-all">${displayAvg}</div>
                            </div>
                            
                            <!-- 타겟 카드 (평균의 2/3) -->
                            <div class="bg-gradient-to-br from-indigo-600 to-blue-700 rounded-3xl p-8 shadow-2xl text-center flex-1 flex flex-col justify-center relative overflow-hidden text-white border-4 border-indigo-300">
                                <div class="absolute -right-10 -top-10 opacity-10"><svg class="w-48 h-48" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"></path></svg></div>
                                <h3 class="text-2xl font-bold mb-4 z-10 opacity-90">${targetTitle}</h3>
                                <div class="text-7xl font-black z-10 drop-shadow-lg break-all">${displayTarget}</div>
                            </div>
                        </div>
                        
                        <!-- 우측: 결과 순위 표 -->
                        <div class="w-full lg:w-2/3 bg-white rounded-3xl shadow-xl border border-gray-200 overflow-hidden flex flex-col max-h-[600px]">
                            <div class="bg-gray-800 text-white font-bold text-xl py-4 px-6 flex justify-between">
                                <span>순위 및 제출 내역</span>
                                <span class="text-gray-400 font-normal">총 ${numBidders}명 제출</span>
                            </div>
                            <div class="overflow-y-auto p-0 flex-grow">
                                <table class="min-w-full text-center border-collapse">
                                    <thead class="bg-gray-50 text-gray-500 font-bold sticky top-0 border-b">
                                        <tr>
                                            <th class="py-3 px-4">순위</th>
                                            <th class="py-3 px-4">이름(학번)</th>
                                            <th class="py-3 px-4">제출값</th>
                                            <th class="py-3 px-4">목표와의 차이</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100 text-lg">
                                        ${scoredSubs.map((s, index) => {
                                            const isWinner = s.diff === minDiff && minDiff !== -1;
                                            const rowClass = isWinner ? "bg-orange-50" : "hover:bg-gray-50";
                                            const rankDisplay = isWinner ? `<span class="text-3xl" title="우승">👑</span>` : `<span class="text-gray-400 font-bold">${index + 1}</span>`;
                                            const diffStr = (Math.round(s.diff * 10) / 10).toFixed(1);
                                            
                                            return `
                                                <tr class="${rowClass} transition-colors">
                                                    <td class="py-4">${rankDisplay}</td>
                                                    <td class="py-4 font-bold text-gray-800">${s.name} <span class="text-sm text-gray-400 font-normal ml-1">${s.id}</span></td>
                                                    <td class="py-4 font-black ${isWinner ? 'text-orange-600 text-2xl' : 'text-gray-700'}">${s.val}</td>
                                                    <td class="py-4 font-bold ${isWinner ? 'text-orange-500' : 'text-blue-500'}">${diffStr}</td>
                                                </tr>
                                            `;
                                        }).join('')}
                                        ${scoredSubs.length === 0 ? `<tr><td colspan="4" class="py-10 text-gray-400">제출된 데이터가 없습니다.</td></tr>` : ''}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                // 대기 화면 (제출 여부 현황)
                boardHTML = `
                    <div class="bg-white rounded-3xl p-8 shadow-sm border border-gray-200 mt-4 min-h-[400px]">
                        ${!isGameStarted ? `
                            <div class="absolute inset-0 bg-white bg-opacity-90 z-20 flex flex-col items-center justify-center rounded-3xl backdrop-blur-sm">
                                <h2 class="text-3xl font-bold text-gray-800 mb-6">학생들이 대기 화면을 보고 있습니다.</h2>
                                <button onclick="handleStartGame()" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-4 px-10 rounded-2xl text-2xl shadow-xl transition-transform transform hover:scale-105 animate-pulse">
                                    학생 입장 허용 (게임 시작)
                                </button>
                            </div>
                        ` : ''}
                        
                        <h3 class="text-xl font-bold text-gray-500 mb-6 flex justify-between relative z-10">
                            <span>학생 제출 현황</span>
                            <span class="text-blue-600 bg-blue-50 px-3 py-1 rounded-full text-base">${numBidders} / ${allStudentsData.length} 명 완료</span>
                        </h3>
                        <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-8 gap-4 relative z-10">
                            ${submissionsThisRound.map(s => `
                                <div class="rounded-xl p-4 border-2 ${s.val !== null ? 'bg-green-50 border-green-200 shadow-sm' : 'bg-gray-50 border-gray-100'} flex flex-col items-center justify-center h-28 transition-all relative overflow-hidden">
                                    <div class="text-lg font-black ${s.val !== null ? 'text-green-800' : 'text-gray-400'} truncate w-full text-center">${s.name}</div>
                                    <div class="text-xs ${s.val !== null ? 'text-green-600' : 'text-gray-300'} mb-2">${s.id}</div>
                                    ${s.val !== null 
                                        ? `<div class="absolute -bottom-2 -right-2 text-4xl opacity-20">✅</div>`
                                        : `<div class="w-2 h-2 rounded-full bg-gray-300 animate-ping mt-1"></div>`
                                    }
                                </div>
                            `).join('')}
                            ${submissionsThisRound.length === 0 ? `<div class="col-span-full text-center text-gray-400 py-20 text-xl font-medium">아직 접속한 학생이 없습니다. 화면에 안내된 주소로 접속하게 해주세요.</div>` : ''}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="flex-grow flex flex-col fade-in w-full max-w-7xl mx-auto pt-2 pb-10">
                    <!-- 교사용 컨트롤 바 -->
                    <div class="bg-slate-900 text-white rounded-3xl p-5 sm:p-6 mb-4 shadow-2xl flex flex-col lg:flex-row justify-between items-center gap-4 border-b-4 border-blue-500">
                        <div class="flex items-center gap-4">
                            <span class="bg-blue-600 px-4 py-1.5 rounded-lg text-sm font-black tracking-widest text-blue-100">TEACHER</span>
                            <h2 class="text-2xl sm:text-3xl font-black tracking-tight">제 ${currentRound} 라운드 <span class="text-slate-400 font-medium ml-2 text-xl">접속: ${allStudentsData.length}명</span></h2>
                        </div>
                        
                        <div class="flex items-center gap-2 bg-slate-800 p-2 rounded-xl transition-all">
                            <button onclick="toggleModeVisibility()" class="text-slate-400 hover:text-white transition-colors px-1 flex items-center" title="진행 모드 숨기기/보이기">
                                ${window.teacherState.isModeVisible ? 
                                    '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>'
                                    : 
                                    '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>'
                                }
                            </button>
                            <span class="text-slate-400 text-sm font-bold mr-2 hidden sm:block">진행 모드:</span>
                            
                            ${window.teacherState.isModeVisible ? `
                                <button onclick="handleSetMode('avg')" class="px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${globalGameState.mode === 'avg' ? 'bg-blue-500 text-white shadow-md' : 'text-slate-300 hover:bg-slate-700 hover:text-white'}">평균</button>
                                <button onclick="handleSetMode('avg_plus_5')" class="px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${globalGameState.mode === 'avg_plus_5' ? 'bg-blue-500 text-white shadow-md' : 'text-slate-300 hover:bg-slate-700 hover:text-white'}">평균 + 5</button>
                                <button onclick="handleSetMode('avg_2_3')" class="px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${globalGameState.mode === 'avg_2_3' ? 'bg-blue-500 text-white shadow-md' : 'text-slate-300 hover:bg-slate-700 hover:text-white'}">평균 2/3</button>
                            ` : `
                                <span class="px-3 py-1.5 rounded-lg text-sm font-bold text-slate-500 tracking-[0.2em] w-20 text-center">***</span>
                            `}
                        </div>

                        <div class="flex flex-wrap justify-center gap-3">
                            ${!isRevealed 
                                ? `<button onclick="handleRevealResults()" class="bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-black py-3 px-6 rounded-xl text-lg shadow-lg flex items-center gap-2 transition-transform transform hover:scale-105"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg> 결과 공개</button>`
                                : `<button onclick="handleNextRound()" class="bg-green-500 hover:bg-green-600 text-white font-black py-3 px-6 rounded-xl text-lg shadow-lg flex items-center gap-2 transition-transform transform hover:scale-105">새 라운드 시작 <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg></button>`
                            }
                            <button onclick="handleResetGame()" class="bg-slate-700 hover:bg-red-600 text-slate-300 hover:text-white font-bold py-3 px-4 rounded-xl text-base shadow-md transition-colors border border-slate-600 hover:border-red-500">초기화</button>
                        </div>
                    </div>
                    ${boardHTML}
                </div>
            `;
        }

        function renderUI() {
            // 입력 필드 포커스 유지 로직 (새로고침 시 방해 방지)
            let activeId = null;
            let activeVal = null;
            if (document.activeElement && document.activeElement.tagName === 'INPUT') {
                activeId = document.activeElement.id;
                activeVal = document.activeElement.value;
            }

            let html = '';
            
            if (!isFirebaseReady) {
                html = getNeedsSetupView();
            } else if (currentMode === 'lobby') {
                html = getLobbyView();
            } else if (currentMode === 'select') {
                html = getSelectView();
            } else if (currentMode === 'student') {
                html = getStudentView();
            } else if (currentMode === 'teacher') {
                html = getTeacherView();
            }

            appContainer.innerHTML = html;

            // 포커스 복원
            if (activeId) {
                const el = document.getElementById(activeId);
                if (el) {
                    el.value = activeVal;
                    el.focus();
                }
            }

            // 계산기 디스플레이 복원 (UI 새로 렌더링 시 값 유지용 - 이미 HTML 템플릿에 들어있으므로 생략가능)
            
            // 수식 렌더링
            setTimeout(renderMath, 10);
        }

        // 앱 시작
        window.onload = () => {
            renderUI();
            if (isFirebaseReady) {
                setupFirebaseListeners();
            }
        };
    </script>
</body>
</html>
